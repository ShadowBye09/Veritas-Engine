<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Veritas — The Guide</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-name">Veritas</div>
      <div class="brand-tag">earth's argument guide</div>
    </div>
    <div class="topbar-controls">
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-mode="kid">kid</button>
        <button class="mode-btn" data-mode="adult">adult</button>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="toggle dark mode">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="search-row">
    <input type="text" id="questionInput" placeholder="Ask about a controversy..." />
    <button id="searchBtn" aria-label="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </div>

  <div id="resultArea"></div>
</div>

<template id="loadingTemplate">
  <div class="loading">
    <div class="spinner"></div>
    <div>Consulting the galactic archives...</div>
  </div>
</template>

<template id="resultTemplate">
  <div class="result">
    <div class="hitchhiker-header ai-only" style="display:none;">
      <h1 class="dont-panic-title">DON'T PANIC</h1>
      <p class="dont-panic-tip"></p>
    </div>

    <h2 class="question-title"></h2>

    <p class="answer-text human-only" style="display:none;"></p>

    <div class="argument-sandbox ai-only" style="display:none;">
      <div class="argument-map">
        <div class="argument-side side-a">
          <h3 class="side-name" id="sideAName"></h3>
          <div class="pillars-container" id="sideAPillars"></div>
        </div>

        <div class="scale-divider">
          <div class="scale-line"></div>
          <div class="scale-icon">⚖️</div>
          <div class="scale-line"></div>
        </div>

        <div class="argument-side side-b">
          <h3 class="side-name" id="sideBName"></h3>
          <div class="pillars-container" id="sideBPillars"></div>
        </div>
      </div>
    </div>

    <div class="disagreement-section">
      <div class="disagreement-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"/></svg>
        <span>The Root of the Fight</span>
      </div>
      <p class="disagreement-text"></p>
    </div>

    <div class="underdog-card ai-only" style="display:none;">
      <div class="underdog-header">
        <span class="underdog-icon">🔭</span>
        <span>Field Notes from the Fringe</span>
      </div>
      <div class="underdog-body">
        <strong class="underdog-name"></strong>
        <p class="underdog-breakthrough"></p>
      </div>
    </div>

    <div class="sources-label">sources weighing on this scale</div>
    <div class="sources-list"></div>

    <button class="read-more-btn" style="display:none;">read more from verified sources ↓</button>
    <div class="more-sources-list" style="display:none;"></div>
  </div>
</template>

<template id="errorTemplate">
  <div class="error-box">
    Our sub-etha sensors are down. Try again in a moment.
  </div>
</template>

<template id="emptyTemplate">
  <div class="error-box">
    The approved sources don't have enough data to weigh this argument yet.
  </div>
</template>

<script src="script.js"></script>
</body>
</html>
