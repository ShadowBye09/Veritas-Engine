<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Veritas — truth, simply</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-name">Veritas</div>
      <div class="brand-tag">truth, simply</div>
    </div>
    <div class="topbar-controls">
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" data-mode="kid">kid</button>
        <button class="mode-btn" data-mode="adult">adult</button>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="toggle dark mode">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="search-row">
    <input type="text" id="questionInput" placeholder="ask anything -- yes, even 'why is the sky blue'" />
    <button id="searchBtn" aria-label="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
  </div>

  <div class="debias-container">
    <label class="debias-switch-label">
      <div class="switch">
        <input type="checkbox" id="debiasToggle">
        <span class="slider round"></span>
      </div>
      <div class="debias-switch-text">
        <span class="debias-title-text">De-Bias & Balance Search</span>
        <span class="debias-desc-text">Sends out two search parties instead of one, so no side of a real debate gets left in the dark</span>
      </div>
    </label>
  </div>

  <div id="resultArea"></div>

</div>

<template id="loadingTemplate">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-text">consulting the trusted shelf of sources...</div>
  </div>
</template>

<template id="resultTemplate">
  <div class="result">
    <div class="badge-row">
      <span class="badge badge-ai ai-only">AI summary, verified sources only</span>
      <span class="badge badge-reviewed human-only" style="display:none;">reviewed by our team</span>
      <span class="badge badge-fresh freshness-badge ai-only" style="display:none;"></span>
      <span class="badge badge-volatility volatility-badge ai-only" style="display:none;"></span>
    </div>

    <h2 class="question-title"></h2>

    <div class="byline human-only" style="display:none;"></div>

    <div class="strata-section ai-only" style="display:none;">
      <div class="strata-bar"></div>
      <div class="strata-caption"></div>
    </div>

    <div class="direct-answer ai-only" style="display:none;">
      <div class="direct-answer-mark">"</div>
      <p class="direct-answer-text"></p>
      <a class="direct-answer-source" target="_blank" rel="noopener noreferrer">
        <span class="direct-answer-tier-badge"></span>
        <span class="direct-answer-source-title"></span>
      </a>
    </div>

    <div class="strategy-banner" style="display:none;">
      <div class="strategy-banner-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>Search De-Biased & Balanced</span>
      </div>
      <div class="strategy-queries">
        <div><strong>Side A:</strong> <span class="query-a-text"></span></div>
        <div><strong>Side B:</strong> <span class="query-b-text"></span></div>
      </div>
    </div>

    <div class="argument-map-section" style="display:none;">
      <div class="argument-map-label">the shape of the argument</div>
      <div class="argument-map-core"></div>
      <div class="argument-map-columns">
        <div class="argument-map-column supporting">
          <div class="argument-map-column-header">supporting</div>
          <div class="argument-map-pillars"></div>
        </div>
        <div class="argument-map-column skeptical">
          <div class="argument-map-column-header">skeptical</div>
          <div class="argument-map-pillars"></div>
        </div>
      </div>
    </div>

    <div class="context-label ai-only" style="display:none;">background & context</div>
    <p class="answer-text"></p>

    <div class="ai-note ai-only">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
      <span class="ai-note-text">the quote above is a direct excerpt; the explanation below is AI-written from the same sources, not by a person</span>
    </div>

    <button class="evidence-trail-btn ai-only" style="display:none;">
      <span>peek behind the curtain</span>
      <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="evidence-trail-list"></div>

    <div class="sources-label">the shelf this was pulled from</div>
    <div class="sources-list"></div>

    <button class="read-more-btn" style="display:none;">read more from verified sources ↓</button>
    <div class="more-sources-list" style="display:none;"></div>

    <button class="emerging-research-btn ai-only" style="display:none;">
      <span>peek at the emerging research ↓</span>
    </button>
    <div class="emerging-research-section" style="display:none;">
      <div class="emerging-research-label">new · not yet peer-reviewed · unverified</div>
      <div class="emerging-research-list"></div>
    </div>

    <div class="disagreement-section">
      <div class="disagreement-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"/></svg>
        <span>any disagreement in the room?</span>
      </div>
      <p class="disagreement-text"></p>
    </div>

    <div class="bottom-row">
      <div class="confidence-row ai-only">confidence: <span class="confidence-value"></span></div>
      <button class="listen-btn" aria-label="read answer aloud">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
        <span class="listen-label">listen</span>
      </button>
    </div>
  </div>
</template>

<template id="errorTemplate">
  <div class="error-box">
    Well, that didn't go to plan -- couldn't reach the verified sources. Give it another go in a moment.
  </div>
</template>

<template id="emptyTemplate">
  <div class="error-box">
    Our trusted shelf came up empty on this one -- not enough there yet to give you a grounded answer.
  </div>
</template>

<script src="script.js"></script>
</body>
</html>
